[project]
name = "ding-mail-sender"
version = "0.1.0"
description = "Windows desktop tool for task-package based batch email sending with Markdown, attachments, IMAP drafts, tray scheduling, and DPAPI-protected SMTP credentials."
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.10.1",
  "openpyxl==3.1.5",
  "markdown-it-py==4.0.0",
  "beautifulsoup4==4.13.4",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.18.0",
]

[tool.unittest]
testpaths = ["tests"]
