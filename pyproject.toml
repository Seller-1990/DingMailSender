[project]
name = "ding-mail-sender"
version = "0.1.0"
description = "Local desktop tool for batch sending task-package emails."
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.10.1",
  "openpyxl==3.1.5",
  "jinja2==3.1.6",
  "markdown-it-py==4.0.0",
  "beautifulsoup4==4.13.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.18.0",
]

[tool.unittest]
testpaths = ["tests"]
